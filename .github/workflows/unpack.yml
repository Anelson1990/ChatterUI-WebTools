name: Unpack ChatterUI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Unpack modified ChatterUI
        run: |
          mkdir -p /tmp/chatter
          unzip -q ChatterUI-with-web-tools.zip -d /tmp/chatter

          # Remove ChatterUI's original GitHub workflows.
          # We don't need them and GitHub blocks the Actions token
          # from modifying workflow files.
          rm -rf /tmp/chatter/ChatterUI-master/.github

          # Copy the actual ChatterUI source into the repository.
          cp -a /tmp/chatter/ChatterUI-master/. .

      - name: Remove uploaded ZIP
        run: |
          rm -f ChatterUI-with-web-tools.zip

      - name: Commit ChatterUI source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack ChatterUI with web tools"
            git push
          fi
