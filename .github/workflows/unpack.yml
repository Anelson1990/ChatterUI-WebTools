name: Unpack ChatterUI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Unpack modified ChatterUI
        run: |
          mkdir -p /tmp/chatter
          unzip -q ChatterUI-with-web-tools.zip -d /tmp/chatter
          cp -a /tmp/chatter/ChatterUI-master/. .

      - name: Remove ZIP
        run: rm -f ChatterUI-with-web-tools.zip

      - name: Commit ChatterUI source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack ChatterUI with web tools"
          git push
